<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022c22" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Base with Squircle Corners (PWA adaptive icon standard) -->
  <rect width="512" height="512" rx="116" fill="url(#brandGrad)" />

  <!-- Subtle Inner Border Accent -->
  <rect x="12" y="12" width="488" height="488" rx="104" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.18" />

  <!-- Main FinTrack Emblem: Trend Chart Bars + Upward Momentum Arrow -->
  <g filter="url(#softShadow)">
    <!-- Chart Base Horizontal Baseline -->
    <rect x="112" y="364" width="288" height="14" rx="7" fill="#ffffff" fill-opacity="0.9" />

    <!-- Column 1 -->
    <rect x="136" y="270" width="44" height="84" rx="12" fill="#ffffff" fill-opacity="0.8" />

    <!-- Column 2 -->
    <rect x="206" y="210" width="44" height="144" rx="12" fill="#ffffff" fill-opacity="0.9" />

    <!-- Column 3 -->
    <rect x="276" y="150" width="44" height="204" rx="12" fill="#ffffff" />

    <!-- Ascending Financial Growth Vector / Arrow -->
    <path d="M128 230 L216 160 L290 195 L372 108" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Arrowhead -->
    <polyline points="340,108 376,108 376,144" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Coin / Dot Indicator on Peak -->
    <circle cx="376" cy="108" r="14" fill="#34d399" stroke="#ffffff" stroke-width="6" />
  </g>
</svg>
